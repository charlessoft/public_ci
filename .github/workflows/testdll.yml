
name: testdll


on:
  repository_dispatch:
    types:
      - testdll
  push:
    branches: [ '*' ]
  pull_request:
  release:
    types: [ created, edited ]
  workflow_dispatch:
    inputs:
      gva_version:
        required: true
        type: string
# env:
  # sss
env:
  TZ: Asia/Shanghai
jobs:
  init:
    if: github.repository_owner == 'charlessoft'
    # runs-on: ubuntu-latest
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, x86]
        # configuration: [Release]
    steps:
      - name: init
        run: |
          echo "charlessoft"
          # echo "${{ toJson(github.event.client_payload) }}"
          # echo "charlessoft11"
          # echo "${{ toJson(github.event.client_payload) }}" > client_payload.json

      # - name: Setup MSBuild
      #   uses: microsoft/setup-msbuild@v1
      
      # - name: Build your project
      #   run: msbuild YourProject.sln /p:Configuration=Release

      - name: Copy UCRT DLLs
        run: |
          mkdir dist
          $platform = "${{ matrix.platform }}"
          if ($platform -eq "x86") { $platform = "x86" }  # 确保格式正确
          
          $ucrtPath = "C:\Program Files (x86)\Windows Kits\10\Redist\ucrt\DLLs\$platform"
          Copy-Item "$ucrtPath\*.dll" -Destination "dist\" -Force
          echo "$platform"
          dir dist
        shell: powershell
  
